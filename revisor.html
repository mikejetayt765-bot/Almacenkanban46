<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Revisor de index.html</title>
</head>
<body style="font-family:Arial;padding:20px">
<h2>Revisor de index.html</h2>
<input type="file" id="archivo" accept=".html">
<pre id="salida" style="white-space:pre-wrap;background:#f5f5f5;padding:15px;margin-top:15px"></pre>

<script>
document.getElementById("archivo").addEventListener("change", function(e){
  let lector = new FileReader();
  lector.onload = function(){
    let texto = lector.result;
    let salida = document.getElementById("salida");
    let partes = texto.split(/<script[^>]*>/i);
    let resultados = [];

    partes.slice(1).forEach(function(bloque, indice){
      let codigo = bloque.split(/<\/script>/i)[0];
      let lineas = codigo.split("\n");
      let pila = [];
      let estado = "codigo";
      let error = null;
      let lineaError = 0;
      let lineaAbre = 0;
      let ultimoSignificativo = "";

      for(let i = 0; i < lineas.length; i++){
        let linea = lineas[i];

        for(let j = 0; j < linea.length; j++){
          let c = linea[j];
          let siguiente = linea[j+1];

          if(estado === "codigo"){
            if(c === "/" && siguiente === "/"){ break; }
            if(c === "/" && siguiente === "*"){ estado = "bloque"; j++; continue; }

            if(c === "/" && "=(,:[!&|?{};+-*%<>~^".indexOf(ultimoSignificativo) >= 0 || ultimoSignificativo === ""){
              estado = "regex";
              continue;
            }

            if(c === "'" || c === '"'){ estado = c; continue; }
            if(c === "(" || c === "{" || c === "["){
              pila.push({caracter: c, linea: i+1});
            }
            if(c === ")" || c === "}" || c === "]"){
              let ultimo = pila.pop();
              if(!ultimo){
                error = "Cierre '" + c + "' sin apertura";
                lineaError = i+1;
                break;
              }
              let pares = {"(":")", "{":"}", "[":"]"};
              if(pares[ultimo.caracter] !== c){
                error = "Se esperaba '" + pares[ultimo.caracter] + "' pero apareció '" + c + "'";
                lineaError = i+1;
                lineaAbre = ultimo.linea;
                break;
              }
            }
            if(c.trim() !== ""){
              ultimoSignificativo = c;
            }
          }else if(estado === "bloque"){
            if(c === "*" && siguiente === "/"){ estado = "codigo"; j++; }
          }else if(estado === "regex"){
            if(c === "\\"){ j++; continue; }
            if(c === "["){ estado = "clase"; continue; }
            if(c === "/"){ estado = "codigo"; }
          }else if(estado === "clase"){
            if(c === "\\"){ j++; continue; }
            if(c === "]"){ estado = "regex"; }
          }else{
            if(c === "\\"){ j++; continue; }
            if(c === estado){ estado = "codigo"; }
          }
        }

        if(error){ break; }
      }

      if(error){
        let desde = Math.max(0, lineaAbre - 3);
        let hasta = Math.min(lineas.length, lineaError + 3);
        let fragmento = [];

        for(let k = desde; k < hasta; k++){
          fragmento.push((k+1) + ": " + lineas[k]);
        }

        resultados.push(
          "Script " + (indice+1) + ": ERROR -> " + error + "\n" +
          "Abierto en línea " + lineaAbre + "\n" +
          "Error en línea " + lineaError + "\n\n" +
          fragmento.join("\n")
        );
      }else{
        resultados.push("Script " + (indice+1) + ": OK");
      }
    });

    salida.textContent = resultados.join("\n\n");
  };
  lector.readAsText(e.target.files[0]);
});
</script>
</body>
</html>

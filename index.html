  document.body.innerHTML =

    "ERROR: " + evento.message + "\n\n" +
    "LÍNEA: " + evento.lineno + "\n\n" +

      ? evento.error.stack
      : "") +
    "</pre>";
});

<script>

  
const firebaseConfig = {
  apiKey: "AIzaSyBeUYiRRJFPEUFIORh5MwLm7aFH2A6pYvY",
  authDomain: "almacen-kanban.firebaseapp.com",
  databaseURL: "https://almacen-kanban-default-rtdb.firebaseio.com",
  projectId: "almacen-kanban",

  messagingSenderId: "434475617870",
  appId: "1:434475617870:web:188bf5b80f00a95066fd1f"
};

let datos = JSON.parse(localStorage.getItem("almacenKanbanMultiusuario") || "null") || {
  usuarios: [],
  materiales: [],
  productos: [],
  kanban: [],
  movimientos: [],
  bitacora: [],
  sesion: null
};

firebase.initializeApp(firebaseConfig);
const baseDatos = firebase.database();


  
let pestana = "mp";
let escanerActivo = null;

baseDatos.ref("almacen").on("value", snapshot => {
  const remoto = snapshot.val() || {};
  const sesionLocal = datos.sesion;

  datos = {
    usuarios: remoto.usuarios || [],
    materiales: remoto.materiales || [],
    productos: remoto.productos || [],
    kanban: remoto.kanban || [],
    movimientos: remoto.movimientos || [],
    bitacora: remoto.bitacora || [],
    sesion: sesionLocal
  };

  mostrar();

}, error => {
  console.error("Error al leer Firebase:", error);
  alert(
    "Error al leer Firebase:\n" +
    error.code + "\n" +
    error.message
  );
});
  
function guardar(){
  let datosSeguros = {
    usuarios: datos.usuarios || [],
    materiales: datos.materiales || [],
    productos: datos.productos || [],
    kanban: datos.kanban || [],
    movimientos: datos.movimientos || [],
    bitacora: datos.bitacora || [],
    sesion: datos.sesion || null
  };

  baseDatos.ref("almacen").set(datosSeguros)
    .then(() => {
      mostrar();
    })
    .catch(error => {
      alert("No se pudo guardar en Firebase: " + error.message);
      console.error(error);
    });
}

function fecha(){
  return new Date().toLocaleString("es-MX");
}

function bitacora(texto){
  datos.bitacora.unshift("[" + fecha() + "] " + texto);
  if(datos.bitacora.length > 150) datos.bitacora.pop();
}

function movimiento(tipo, codigo, nombre, cantidad, unidad, ruta){
  datos.movimientos.unshift({
    fecha: fecha(),
    tipo,
    codigo,
    material: nombre,
    cantidad,
    unidad,
    ruta,
    rol: datos.sesion.rol
  });
}

/* LOGIN */
window.abrirPantallaPorNotificacion = function(destino){
  let pantalla = String(destino || "").replace("#", "");

  const pantallasValidas = [
    "mp",
    "produccion",
    "pt",
    "ingreso",
    "diseno",
    "kanban",
    "movimientos",
    "roles"
  ];

  if(pantallasValidas.includes(pantalla)){
    pestana = pantalla;
  }else{
    pestana = "mp";
  }

  mostrar();
};
function pantallaLogin(){
  document.getElementById("aplicacion").style.display = "none";
  document.getElementById("pantallaLogin").innerHTML = `
  <div class="tarjeta">
    <h2>Iniciar sesión</h2>
    <input id="usuarioLogin" placeholder="Usuario">
    <input id="contrasenaLogin" type="password" placeholder="Contraseña">
    <button class="azul" onclick="iniciarSesion()">Iniciar sesión</button>

    <h3>Crear cuenta nueva</h3>
    <input id="usuarioNuevo" placeholder="Usuario nuevo">
    <input id="contrasenaNueva" type="password" placeholder="Contraseña">
    <select id="rolNuevo">
      <option>Almacenista</option>
      <option>Supervisor de almacén</option>
      <option>Operador de producción</option>
      <option>Líder de producción</option>
      <option>Control de calidad</option>
      <option>Planeación</option>
      <option>Registro / sistemas</option>
      <option>Entregas / logística</option>
      <option>Presentador</option>
      <option>Auditor</option>
    </select>
    <button class="verde" onclick="crearCuenta()">Registrarme</button>
  </div>`;
}

function crearCuenta(){
  let usuario = document.getElementById("usuarioNuevo").value.trim();
  let contrasena = document.getElementById("contrasenaNueva").value.trim();
  let rol = document.getElementById("rolNuevo").value;

  if(!usuario || !contrasena){
    alert("Escriba usuario y contraseña.");
    return;
  }

  if(datos.usuarios.find(u => u.usuario === usuario)){
    alert("Ese usuario ya existe.");
    return;
  }

  datos.usuarios.push({usuario, contrasena, rol});
  bitacora("Nuevo usuario registrado: " + usuario);
  guardar();
  alert("Cuenta creada. Ahora inicie sesión.");
}

function iniciarSesion(){
  let usuario = document.getElementById("usuarioLogin").value.trim();
  let contrasena = document.getElementById("contrasenaLogin").value.trim();

  let cuenta = datos.usuarios.find(u => u.usuario === usuario && u.contrasena === contrasena);

  if(!cuenta){
    alert("Usuario o contraseña incorrectos.");
    return;
  }

  datos.sesion = {usuario: cuenta.usuario, rol: cuenta.rol};
  bitacora("Inicio de sesión: " + usuario);
  
 SistemaAvisos.iniciar();
  const botonNotificaciones = document.createElement("button");
botonNotificaciones.type = "button";
botonNotificaciones.className = "azul";
botonNotificaciones.textContent = "Activar notificaciones";

botonNotificaciones.onclick = async () => {
  const resultado = await SistemaAvisos.pedirPermiso();

  if(resultado === "granted"){
    alert("Notificaciones activadas.");
  }else{
    alert(
      "No se activaron las notificaciones. " +
      "Puedes activarlas desde los ajustes del navegador o del APK."
    );
  }

  botonNotificaciones.remove();
};

document.getElementById("infoUsuario").after(botonNotificaciones);
  guardar();
}

function cerrarSesion(){
  datos.sesion = null;
  guardar();
}

function cambiarRol(){
  let nuevoRol = prompt("Escriba su nuevo rol:", datos.sesion.rol);
  if(!nuevoRol) return;

  datos.sesion.rol = nuevoRol;

  let cuenta = datos.usuarios.find(u => u.usuario === datos.sesion.usuario);
  if(cuenta) cuenta.rol = nuevoRol;

  bitacora("Cambio de rol: " + datos.sesion.usuario + " ahora es " + nuevoRol);
  guardar();
}

/* MENÚ SEGÚN ROL */

function menuPorRol(){
  let rol = datos.sesion.rol;

  if(rol === "Almacenista" || rol === "Supervisor de almacén"){
    return [
      ["mp","Almacén MP"],
      ["pt","Almacén PT"],
      ["ingreso","Ingreso MP"],
      ["movimientos","Movimientos"]
    ];
  }

  if(rol === "Operador de producción" || rol === "Líder de producción"){
    return [
      ["produccion","Producción"],
      ["pt","Producto terminado"],
      ["kanban","Kanban"],
      ["movimientos","Movimientos"]
    ];
  }

  if(rol === "Planeación"){
    return [
      ["diseno","Diseñar producto"],
      ["kanban","Kanban"],
      ["movimientos","Movimientos"]
    ];
  }

  if(rol === "Control de calidad"){
    return [
      ["pt","Producto terminado"],
      ["movimientos","Movimientos"]
    ];
  }

  return [
    ["mp","Almacén MP"],
    ["produccion","Producción"],
    ["pt","Almacén PT"],
    ["ingreso","Ingreso MP"],
    ["diseno","Diseñar producto"],
    ["kanban","Kanban"],
    ["movimientos","Movimientos"],
    ["roles","Roles"]
  ];
}

function mostrar(){
  if(!datos.sesion){
    pantallaLogin();
    return;
  }

  document.getElementById("pantallaLogin").innerHTML = "";
  document.getElementById("aplicacion").style.display = "block";

  let menu = menuPorRol();

  if(!menu.find(m => m[0] === pestana)){
    pestana = menu[0][0];
}

  document.getElementById("menu").innerHTML = menu.map(p =>
    `<button class="${pestana===p[0]?"activo":""}" onclick="pestana='${p[0]}';mostrar()">${p[1]}</button>`
  ).join("") + `<button onclick="cerrarSesion()">Salir</button>`;

  document.getElementById("infoUsuario").innerText =
    "Usuario: " + datos.sesion.usuario + " | Rol: " + datos.sesion.rol;

  if(pestana === "mp") verMP();
  if(pestana === "produccion") verProduccion();
  if(pestana === "pt") verPT();
  if(pestana === "ingreso") verIngreso();
  if(pestana === "diseno") verDiseno();
  if(pestana === "kanban") verKanban();
  if(pestana === "movimientos") verMovimientos();
  if(pestana === "roles") verRoles();
}

async function abrirCamara(campoDestino, accionAutomatica){
  let contenedor = document.getElementById("camara");

  if(!contenedor){
    alert("Esta pantalla no tiene cámara disponible.");
    return;
  }

  if(escanerActivo){
    escanerActivo.stop();
    escanerActivo = null;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){
    contenedor.innerHTML =
      "<p>Este dispositivo no permite usar la cámara desde la aplicación.</p>";
    return;
  }

  if(!("BarcodeDetector" in window)){
    contenedor.innerHTML =
      "<p>Este navegador no admite lectura automática de códigos. " +
      "Escribe el código manualmente o usa un escáner físico.</p>";
    return;
  }

  try{
    let stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: {ideal: 1280},
        height: {ideal: 720}
      }
    });

    let video = document.createElement("video");
    video.setAttribute("playsinline", true);
    video.setAttribute("muted", true);
    video.style.width = "100%";
    video.style.borderRadius = "10px";
    video.style.background = "#000";

    video.srcObject = stream;

    contenedor.innerHTML = "";
    contenedor.appendChild(video);

    await video.play();

    let detector = new BarcodeDetector({
      formats: [
        "code_128",
        "code_39",
        "ean_13",
        "ean_8",
        "qr_code",
        "data_matrix"
      ]
    });

    let detenido = false;

    escanerActivo = {
      stop: function(){
        detenido = true;
        stream.getTracks().forEach(track => track.stop());
      }
    };

    async function leer(){
      if(detenido) return;

      try{
        let codigos = await detector.detect(video);

        if(codigos.length > 0){
          let codigo = codigos[0].rawValue;

          document.getElementById(campoDestino).value = codigo;

          stream.getTracks().forEach(track => track.stop());
          detenido = true;
          escanerActivo = null;

          contenedor.innerHTML =
            "<p>Código detectado: <b>" + codigo + "</b></p>";

          if(typeof accionAutomatica === "function"){
            accionAutomatica();
          }

          return;
        }
      }catch(error){
        console.warn("Error al leer código:", error);
      }

      requestAnimationFrame(leer);
    }

    leer();

  }catch(error){
    contenedor.innerHTML =
      "<p>No se pudo abrir la cámara. Autoriza el acceso a la cámara " +
      "o usa el escáner físico.</p>";

    console.error(error);
  }
  }
/* ALMACÉN MP */

function verMP(){
  let filas = datos.materiales.map(m => `
    <tr>
      <td><b>${m.codigo}</b></td>
      <td>${m.nombre}</td>
      <td>${m.mp} ${m.unidad}</td>
      <td><span class="estado ${m.mp <= 0 ? "agotado" : "ok"}">${m.mp <= 0 ? "AGOTADO" : "DISPONIBLE"}</span></td>
    </tr>`).join("");

  document.getElementById("contenido").innerHTML = `
  <div class="tarjeta">
    <h2>Almacén de Materia Prima</h2>

    <input id="escanerMP" placeholder="Escanear código de materia prima">
    <button class="naranja" onclick="abrirCamara('escanerKanban', () => procesarKanban('escanerKanban'))">Escanear Kanban con cámara</button>
    <button class="naranja" onclick="procesarMP()">Procesar código escaneado</button>

    <input id="serieMP" placeholder="Escribir número de serie">
    <button class="verde" onclick="procesarMP('serieMP')">Buscar por número de serie</button>

    <div id="camara"></div>
  </div>

  <div class="tarjeta">
    <h2>Existencias de materia prima</h2>
    <table>
      <tr><th>Código</th><th>Material</th><th>Stock MP</th><th>Estado</th></tr>
    ${filas || "<tr><td colspan='4'>No hay materiales registrados</td></tr>"}
    </table>

    <button class="rojo" onclick="eliminarMaterial()">Eliminar materia prima</button>
    <button class="rojo" onclick="eliminarMovimientoMP()">Eliminar movimientos de MP</button>
    <button class="rojo" onclick="eliminarBitacoraMP()">Eliminar bitácora de MP</button>
  </div>`;
}

function procesarMP(campo = "escanerMP"){
  let codigo = document.getElementById(campo).value.trim();
  if(!codigo){
    alert("Escanee o escriba un código.");
    return;
  }

  let material = datos.materiales.find(m => m.codigo === codigo);

  if(!material){
    alert("Este código no pertenece a una materia prima registrada.");
    return;
  }

  let cantidad = parseInt(prompt("Cantidad recibida de " + material.nombre + ":", "1"));

  if(!cantidad || cantidad <= 0){
    alert("Cantidad inválida.");
    return;
  }

  material.mp += cantidad;

    movimiento("Entrada MP", material.codigo, material.nombre, cantidad, material.unidad, "Proveedor → Almacén MP");
  bitacora("Ingreso de " + cantidad + " " + material.unidad + " de " + material.nombre);

  document.getElementById(campo).value = "";

  SistemaAvisos.avisar({
    titulo: "Ingreso de materia prima",
    mensaje:
      "Se ingresaron " + cantidad + " " + material.unidad +
      " de " + material.nombre + ".",
    destino: "#mp",
    id: "ingreso-" + material.codigo + "-" + Date.now()
  }).catch(error => {
    console.warn("No se pudo enviar el aviso:", error);
  });

  guardar();
}


  
/* PRODUCCIÓN */

function verProduccion(){
  let filas = datos.materiales.map(m => `
    <tr>
      <td><b>${m.codigo}</b></td>
      <td>${m.nombre}</td>
      <td>${m.produccion} ${m.unidad}</td>
      <td><span class="estado ${m.produccion <= 0 ? "agotado" : "ok"}">${m.produccion <= 0 ? "SIN MATERIAL" : "DISPONIBLE"}</span></td>
    </tr>`).join("");

  document.getElementById("contenido").innerHTML = `
  <div class="tarjeta">
    <h2>Almacén de Producción</h2>
    <p>Escanee una tarjeta Kanban física para mover material de MP a Producción.</p>

    <input id="escanerKanban" placeholder="Escanear código de tarjeta Kanban">
    <button class="naranja" onclick="abrirCamara('escanerKanban', () => procesarKanban('escanerKanban'))">Escanear Kanban con cámara</button>
    <button class="azul" onclick="procesarKanban()">Procesar Kanban</button>

    <input id="serieKanban" placeholder="Escribir número de serie de Kanban">
    <button class="verde" onclick="procesarKanban('serieKanban')">Buscar Kanban por número de serie</button>

    <div id="camara"></div>
  </div>

  <div class="tarjeta">
    <h2>Material disponible en producción</h2>
    <table>
      <tr><th>Código</th><th>Material</th><th>Cantidad</th><th>Estado</th></tr>
    ${filas || "<tr><td colspan='4'>No hay material en producción</td></tr>"}
    </table>

    <button class="rojo" onclick="eliminarKanban()">Eliminar tarjeta Kanban</button>
    <button class="rojo" onclick="eliminarMovimientoProduccion()">Eliminar movimientos de Producción</button>
    <button class="rojo" onclick="eliminarBitacoraProduccion()">Eliminar bitácora de Producción</button>
  </div>`;
}

function procesarKanban(campo = "escanerKanban"){
  let codigo = document.getElementById(campo).value.trim();
  if(!codigo){
    alert("Escanee o escriba el código de la tarjeta Kanban.");
    return;
  }

  let tarjeta = datos.kanban.find(k => k.codigo === codigo);

  if(!tarjeta){
    alert("Código Kanban no válido.");
    return;
  }

  let material = datos.materiales.find(m => m.codigo === tarjeta.codigoMaterial);

  if(!material){
    alert("Material no encontrado.");
    return;
  }

  if(material.mp < tarjeta.cantidad){
    alert("No hay suficiente materia prima en el almacén MP.");
    return;
  }

  material.mp -= tarjeta.cantidad;
  material.produccion += tarjeta.cantidad;
  if(material.mp <= 0){
    SistemaAvisos.avisar({
      titulo: "Stock agotado",
      mensaje:
        "El material " + material.nombre +
        " se quedó sin existencias en Almacén MP.",
      destino: "#mp",
      id: "stock-" + material.codigo + "-" + Date.now()
    }).catch(error => {
      console.warn("No se pudo enviar el aviso:", error);
    });
  }
    movimiento("Kanban", material.codigo, material.nombre, tarjeta.cantidad, material.unidad, "Almacén MP → Producción");
  bitacora("Kanban " + tarjeta.codigo + " escaneada.");

  document.getElementById(campo).value = "";

  SistemaAvisos.avisar({
    titulo: "Movimiento Kanban",
    mensaje:
      "La tarjeta " + tarjeta.codigo + " movió " +
      tarjeta.cantidad + " " + material.unidad +
      " de " + material.nombre +
      " de Almacén MP a Producción.",
    destino: "#kanban",
    id: "kanban-" + tarjeta.codigo + "-" + Date.now()
  }).catch(error => {
    console.warn("No se pudo enviar el aviso:", error);
  });

  guardar();
}

function procesarPT(campo = "escanerPT"){
  let codigo = document.getElementById(campo).value.trim();
  if(!codigo){
    alert("Escanee o escriba el código del producto.");
    return;
  }

  let producto = datos.productos.find(p => p.codigo === codigo);

  if(!producto){
    alert("Este código no pertenece a un producto terminado registrado.");
    return;
  }

  let faltantes = [];

  producto.componentes.forEach(c => {
    let material = datos.materiales.find(m => m.codigo === c.codigo);
    if(!material || material.produccion < c.cantidad){
      faltantes.push(material ? material.nombre : c.codigo);
    }
  });

  if(faltantes.length > 0){
    alert("Falta material en producción: " + faltantes.join(", "));
    return;
  }

  producto.componentes.forEach(c => {
    let material = datos.materiales.find(m => m.codigo === c.codigo);
    material.produccion -= c.cantidad;

    movimiento("Consumo PT", material.codigo, material.nombre, c.cantidad, material.unidad, "Producción → Producto terminado");
  });

  producto.pt = (producto.pt || 0) + 1;

    movimiento("Producto terminado", producto.codigo, producto.nombre, 1, "pza", "Producción → Almacén PT");
  bitacora("Producto " + producto.nombre + " registrado en PT.");

  document.getElementById(campo).value = "";

  SistemaAvisos.avisar({
    titulo: "Producto terminado",
    mensaje:
      "Se registró 1 unidad de " + producto.nombre +
      " en Almacén PT.",
    destino: "#pt",
    id: "pt-" + producto.codigo + "-" + Date.now()
  }).catch(error => {
    console.warn("No se pudo enviar el aviso:", error);
  });

  guardar();
}

function permisoEliminar(area){
  if(!datos.sesion){
    alert("Primero inicia sesión.");
    return false;
  }

  const rol = datos.sesion.rol;

  const permisos = {
    materiales: [
      "Registro / sistemas",
      "Supervisor de almacén",
      "Almacenista"
    ],
    productos: [
      "Registro / sistemas",
      "Planeación",
      "Líder de producción",
      "Control de calidad",
      "Entregas / logística"
    ],
    kanban: [
      "Registro / sistemas",
      "Planeación",
      "Líder de producción",
      "Supervisor de almacén"
    ]
  };

  if(!(permisos[area] || []).includes(rol)){
    alert("Tu rol no tiene permiso para esta eliminación.");
    return false;
  }

  return true;
}

function registrarEliminacion(texto){
  if(!Array.isArray(datos.bitacora)){
    datos.bitacora = [];
  }

  bitacora(
    datos.sesion.usuario + " (" +
    datos.sesion.rol + "): " + texto
  );

  guardar();
}

/* ELIMINAR MATERIA PRIMA */

function eliminarMaterial(){
  if(!permisoEliminar("materiales")) return;

  const entrada = prompt(
    "Escribe el código exacto de la materia prima:"
  );

  if(entrada === null) return;

  const codigo = entrada.trim();
  if(!codigo) return;

  const materiales = datos.materiales || [];
  const material = materiales.find(m => m.codigo === codigo);

  if(!material){
    alert("No se encontró esa materia prima.");
    return;
  }

  if(
    Number(material.mp || 0) !== 0 ||
    Number(material.produccion || 0) !== 0
  ){
    alert(
      "No se puede eliminar: todavía tiene existencias " +
      "en MP o Producción. Primero registra los " +
      "movimientos o ajustes correspondientes."
    );
    return;
  }

  const usadaEnProducto = (datos.productos || []).some(p =>
    (p.componentes || []).some(c => c.codigo === codigo)
  );

  const usadaEnKanban = (datos.kanban || []).some(k =>
    k.codigoMaterial === codigo
  );

  if(usadaEnProducto || usadaEnKanban){
    alert(
      "No se puede eliminar: está vinculada a " +
      "un producto o a una tarjeta Kanban."
    );
    return;
  }

  if(!confirm(
    "¿Eliminar la materia prima " +
    material.nombre + " (" + codigo + ")?"
  )) return;

  datos.materiales = materiales.filter(m => m.codigo !== codigo);

  registrarEliminacion(
    "Eliminó materia prima: " + material.nombre +
    " (" + codigo + ")."
  );
}

function seleccionSistemas(){
  const area = document.getElementById("areaSistemas").value;

  const codigo = document.getElementById(
    "codigoSistemas"
  ).value.trim();

  const lista = datos[area] || [];

    return null;
  }

  return {area, codigo, lista, indice};
}

/* Validar registros corregidos. */

function validarRegistroSistemas(area, registro){
  const cantidadValida = valor =>
    typeof valor === "number" &&
    Number.isFinite(valor) &&
    valor >= 0;

  if(
    !registro ||
    typeof registro !== "object" ||
    Array.isArray(registro) ||
    typeof registro.codigo !== "string"
  ){
    throw new Error("El registro debe tener un código de texto.");
  }

  if(area === "materiales"){
    if(
      !registro.nombre ||
      !registro.unidad ||
      !cantidadValida(registro.mp) ||
      !cantidadValida(registro.produccion)
    ){
      throw new Error(
        "Revisa nombre, unidad y existencias no negativas."
      );
    }
  }

  if(area === "productos"){
    if(
      !registro.nombre ||
      !cantidadValida(registro.pt) ||
      !Array.isArray(registro.componentes) ||
      registro.componentes.length === 0
    ){
      throw new Error(
        "El producto necesita nombre, stock y componentes."
      );
    }

    registro.componentes.forEach(componente => {
      if(
        !componente ||
        !cantidadValida(componente.cantidad) ||
        componente.cantidad <= 0 ||
        !(datos.materiales || []).some(
          m => m.codigo === componente.codigo
        )
      ){
        throw new Error("Hay un componente inválido.");
      }
    });

    const codigos = registro.componentes.map(c => c.codigo);

    if(new Set(codigos).size !== codigos.length){
      throw new Error(
        "No repitas componentes: suma sus cantidades."
      );
    }
  }

  if(area === "kanban"){
    const material = (datos.materiales || []).find(
      m => m.codigo === registro.codigoMaterial
    );

    if(
      !material ||
      !cantidadValida(registro.cantidad) ||
      registro.cantidad <= 0 ||
      !["BIN 1", "BIN 2", "BIN 3"].includes(registro.bin)
    ){
      throw new Error(
        "Revisa material, cantidad positiva y bin."
      );
    }

    registro.material = material.nombre;
    registro.unidad = material.unidad;
  }
}

/* Corrección mediante el registro JSON completo. */

function corregirRegistroSistemas(){
  if(!exigirEncargado()) return;

  const seleccion = seleccionSistemas();
  if(!seleccion) return;

  const {area, codigo, lista, indice} = seleccion;

  const texto = prompt(
    "Corrige los valores. Conserva las comillas, " +
    "comas y nombres de campos. No cambies el código.",
    JSON.stringify(lista[indice], null, 2)
  );

  if(texto === null) return;

  try{
    const corregido = JSON.parse(texto);

    if(corregido.codigo !== codigo){
      throw new Error("No se permite cambiar el código.");
    }

    validarRegistroSistemas(area, corregido);

    if(!confirm("¿Guardar la corrección de " + codigo + "?")){
      return;
    }

    datos[area][indice] = corregido;

    bitacora(
      "Encargado de sistemas corrigió " +
      area + ": " + codigo
    );

    guardar();

  }catch(error){
    alert("No se aplicó la corrección:\n" + error.message);
  }
}

/* Borrado individual con comprobaciones. */

function borrarRegistroSistemas(){
  if(!exigirEncargado()) return;

  const seleccion = seleccionSistemas();
  if(!seleccion) return;

  const {area, codigo, lista, indice} = seleccion;
  const registro = lista[indice];

  if(area === "materiales"){
    const tieneStock =
      Number(registro.mp || 0) !== 0 ||
      Number(registro.produccion || 0) !== 0;

    const tieneVinculos =
      (datos.kanban || []).some(
        k => k.codigoMaterial === codigo
      ) ||
      (datos.productos || []).some(p =>
        (p.componentes || []).some(c => c.codigo === codigo)
      );

    if(tieneStock || tieneVinculos){
      alert(
        "No se puede eliminar: tiene existencias " +
        "o está vinculada a productos o Kanban."
      );
      return;
    }
  }

  if(
    area === "productos" &&
    Number(registro.pt || 0) !== 0
  ){
    alert("No se puede eliminar un producto con existencias.");
    return;
  }

  if(!confirm(
    "¿Eliminar " + codigo + " de " + area + "?\n" +
    "Esto no revierte movimientos ni modifica existencias."
  )) return;

  datos[area] = lista.filter(r => r.codigo !== codigo);

  bitacora(
    "Encargado de sistemas eliminó " +
    area + ": " + codigo
  );

  guardar();
}

async function crearUsuarioDesdeSistemas(){
  if(!exigirEncargado()) return;

  const usuario = document.getElementById(
    "altaUsuarioNombre"
  ).value.trim();

  const contrasena = document.getElementById(
    "altaUsuarioClave"
  ).value;
  
  const repetir = document.getElementById(
    "altaUsuarioRepetir"
  ).value;

  const rol = document.getElementById(
    "altaUsuarioRol"
  ).value;

  if(!usuario || !contrasena.trim()){
    alert("Escribe un usuario y una contraseña.");
    return;
  }

  // El inicio de sesión actual elimina espacios
  // al principio y al final de la contraseña.
  if(contrasena !== contrasena.trim()){
    alert(
      "La contraseña no debe empezar ni terminar con espacios."
    );
    return;
  }

  if(contrasena !== repetir){
    alert("Las contraseñas no coinciden.");
    return;
  }

  if(usuario.toLowerCase() === "encargado de sistemas"){
    alert(
      "Ese nombre está reservado para la cuenta principal."
    );
    return;
  }

  const rolesPermitidos = [
    "Almacenista",
    "Supervisor de almacén",
    "Operador de producción",
    "Líder de producción",
    "Control de calidad",
    "Planeación",
    "Registro / sistemas",
    "Entregas / logística",
    "Presentador",
    "Auditor"
  ];

  if(!rolesPermitidos.includes(rol)){
    alert("Selecciona un rol válido.");
    return;
  }

  if(!confirm(
    "¿Crear el usuario \"" + usuario +
    "\" con el rol \"" + rol + "\"?"
  )) return;

  const boton = document.getElementById("botonAltaUsuario");
  boton.disabled = true;
  boton.textContent = "Guardando...";

  try{
    const resultado = await baseDatos
      .ref("almacen/usuarios")
      .transaction(actual => {
        const usuarios = actual
          ? Object.values(actual).filter(Boolean)
          : [];

        const existe = usuarios.some(cuenta =>
          String(cuenta.usuario || "")
            .trim()
            .toLowerCase() === usuario.toLowerCase()
        );

        if(existe){
          return;
        }

        usuarios.push({
          usuario,
          contrasena,
          rol
        });

        return usuarios;
      }, undefined, false);

    if(!resultado.committed){
      alert(
        "No se creó la cuenta: ya existe un usuario " +
        "con ese nombre."
      );
      return;
    }

    datos.usuarios = Object.values(
      resultado.snapshot.val() || {}
    ).filter(Boolean);

    localStorage.setItem(
      "almacenKanbanMultiusuario",
      JSON.stringify(datos)
    );

    alert(
      "Usuario creado en Firebase.\n\n" +
      "Usuario: " + usuario + "\n" +
      "Rol: " + rol
    );

    if(esEncargado()){
      panelSistemas();
    }

  }catch(error){
    console.error("Error al crear usuario:", error);

    alert(
      "No se pudo crear el usuario en Firebase:\n" +
      error.code + "\n" +
      error.message
    );

  }finally{
    if(boton.isConnected){
      boton.disabled = false;
      boton.textContent = "Crear usuario";
    }
  }
}

        const reemplazo = operacion(base, cuenta);
        return reemplazo || base;

      }catch(error){
        causa = error.message;
        return;
      }
    }, undefined, false);

    if(!resultado.committed){
      throw new Error(causa || "La operación fue cancelada.");
    }

    const nuevo = resultado.snapshot.val();

    if(!nuevo){
      throw new Error("No existe información del almacén en Firebase.");
    }

    d = normalizar(nuevo);
    actualizarSesion();
    pendiente = false;

    return true;

  }finally{
    ocupado = false;
  }
}

function actualizarSesion(){
  if(!sesion) return;

  const cuenta = cuentaActual(d);

  if(!cuenta){
    sesion = null;
    sessionStorage.removeItem("kanbanV2Sesion");
    return;
  }

  sesion = {usuario: cuenta.usuario, rol: cuenta.rol};
}

  return `<button class="${h(clase)}"
    onclick="${h(llamada)}">${h(texto)}</button>`;
}

function buscarMaterial(base, codigo){
  const material = base.materiales.find(m => m.codigo === codigo);
  if(!material) throw new Error("Materia prima no encontrada.");
  return material;
}

function buscarProducto(base, codigo){
  const producto = base.productos.find(p => p.codigo === codigo);
  if(!producto) throw new Error("Producto no encontrado.");
  return producto;
}

function codigoLibre(base, codigo, excluirProducto = false){
  if(!codigo) throw new Error("Falta el código.");

  if(
    base.materiales.some(m => m.codigo === codigo) ||
    base.kanban.some(k => k.codigo === codigo) ||
    (!excluirProducto &&
      base.productos.some(p => p.codigo === codigo))
  ){
    throw new Error("Ese código ya está registrado.");
  }
}

function detenerCamara(){
  lecturaCamara++;

  if(streamCamara){
    streamCamara.getTracks().forEach(t => t.stop());
    streamCamara = null;
  }
}

K.escanear = async function(destino){
  detenerCamara();

  if(!navigator.mediaDevices || !window.BarcodeDetector){
    throw new Error(
      "Este navegador no permite este escáner. " +
      "Escribe el código o usa un lector físico."
    );
  }

  const contenedor = document.getElementById("kCamara");

  if(!contenedor) throw new Error("No hay visor de cámara.");

  const formatos = await BarcodeDetector.getSupportedFormats();
  const permitidos = ["code_128", "ean_13", "ean_8", "code_39", "qr_code"]
    .filter(f => formatos.includes(f));

  if(!permitidos.length){
    throw new Error("No hay formatos compatibles. Escribe el código.");
  }

  const token = lecturaCamara;
  const flujo = await navigator.mediaDevices.getUserMedia({
    video: {facingMode: "environment"}
  });

  if(token !== lecturaCamara){
    flujo.getTracks().forEach(t => t.stop());
    return;
  }

  streamCamara = flujo;
  contenedor.innerHTML = "<video autoplay playsinline muted></video>";

  const video = contenedor.querySelector("video");
  video.srcObject = flujo;
  await video.play();

  const detector = new BarcodeDetector({formats: permitidos});

  async function leer(){
    if(token !== lecturaCamara) return;

    try{
      const resultados = await detector.detect(video);

      if(resultados.length){
        const campoDestino = document.getElementById(destino);

        if(campoDestino) campoDestino.value = resultados[0].rawValue;

        detenerCamara();
        contenedor.textContent = "Código capturado.";
        return;
      }
    }catch(error){
      // Se vuelve a intentar en el siguiente cuadro.
    }

    requestAnimationFrame(leer);
  }

  leer();
};

K.entrada = async function(){

  const cantidad = numero(campo("kEntradaCantidad"));

  await cambiar("mpAgregar", base => {
    const m = buscarMaterial(base, codigo);
    m.mp = Number(m.mp || 0) + cantidad;

K.editarMP = async function(codigo){
  const m = buscarMaterial(d, codigo);

  const nombre = prompt("Nombre del material:", m.nombre);
  if(nombre === null) return;

  const unidad = prompt("Unidad:", m.unidad);
  if(unidad === null) return;

  const valor = prompt("Existencias correctas en MP:", m.mp || 0);
  if(valor === null) return;

  const cantidad = numero(valor, true);
  const motivo = prompt("Motivo de la corrección:");
  if(!motivo || !motivo.trim()) return;

  if(!nombre.trim() || !unidad.trim()){
    throw new Error("Nombre y unidad son obligatorios.");
  }

  await cambiar("mpEditar", base => {
    const actual = buscarMaterial(base, codigo);
    const diferencia = cantidad - Number(actual.mp || 0);

    actual.nombre = nombre.trim();
    actual.unidad = unidad.trim();
    actual.mp = cantidad;

    movimiento(base, "Ajuste MP", actual, diferencia, motivo.trim());
    log(base, "Corrigió MP " + codigo + ": " + motivo.trim());
  });

  K.show();
};

K.borrarMP = async function(codigo){
  if(!confirm("¿Eliminar la materia prima " + codigo + "?")) return;

  await cambiar("mpBorrar", base => {
    const m = buscarMaterial(base, codigo);

    if(Number(m.mp || 0) !== 0 || Number(m.produccion || 0) !== 0){
      throw new Error("Primero deja sus existencias en cero mediante ajustes.");
    }

    if(
      base.productos.some(p =>
        (p.componentes || []).some(c => c.codigo === codigo)
      ) ||
      base.kanban.some(k => k.codigoMaterial === codigo) ||
      base.solicitudes.some(s =>
        s.codigoMaterial === codigo && s.estado === "pendiente"
      )
    ){
      throw new Error("Tiene productos, Kanban o solicitudes vinculadas.");
    }

    base.materiales = base.materiales.filter(m => m.codigo !== codigo);
    log(base, "Eliminó materia prima " + codigo);
  });

  K.show();
};

K.resolver = async function(solicitudId, aprobar){
  const motivo = aprobar ? "" : prompt("Motivo del rechazo:");
  if(!aprobar && (!motivo || !motivo.trim())) return;

  if(aprobar && !confirm("¿Autorizar y entregar esta solicitud?")) return;

  await cambiar("resolver", base => {
    const s = base.solicitudes.find(x => x.id === solicitudId);

    if(!s || s.estado !== "pendiente"){
      throw new Error("La solicitud ya fue resuelta o no existe.");
    }

    if(aprobar){
      const m = buscarMaterial(base, s.codigoMaterial);
      const cantidad = numero(s.cantidad);

      if(Number(m.mp || 0) < cantidad){
        throw new Error("Ya no hay suficiente stock en MP.");
      }

      m.mp = Number(m.mp || 0) - cantidad;
      m.produccion = Number(m.produccion || 0) + cantidad;

      movimiento(base, "Entrega Kanban", m, cantidad, "MP → Producción");
    }

    s.estado = aprobar ? "aprobada" : "rechazada";
    s.resueltaPor = sesion.usuario;
    s.fechaResolucion = ahora();
    s.motivo = motivo || "";

    log(base, s.estado + " solicitud " + solicitudId);
  });

  K.show();
};

K.solicitar = async function(){
  const codigo = campo("kSolicitarCodigo");
  const solicitudId = id();

  await cambiar("solicitar", base => {
    const k = base.kanban.find(x => x.codigo === codigo);
    if(!k) throw new Error("Tarjeta Kanban no encontrada.");

    if(base.solicitudes.some(s =>
      s.kanban === codigo && s.estado === "pendiente"
    )){
      throw new Error("Esta tarjeta ya tiene una solicitud pendiente.");
    }

    const m = buscarMaterial(base, k.codigoMaterial);
    const cantidad = numero(k.cantidad);

    base.solicitudes.unshift({
      id: solicitudId,
      kanban: codigo,
      codigoMaterial: m.codigo,
      material: m.nombre,
      cantidad,
      unidad: m.unidad,
      usuario: sesion.usuario,
      fecha: ahora(),
      estado: "pendiente"
    });

    log(base, "Solicitó MP mediante Kanban " + codigo);
  });

  K.show();
};

  const codigoMaterial = campo("kKanbanMaterial");
  const cantidad = numero(campo("kKanbanCantidad"));
  const bin = campo("kKanbanBin");

  await cambiar("kanbanCrear", base => {
    codigoLibre(base, codigo);

    base.kanban.push({

K.ajustarProduccion = async function(codigo, retirar){
  const valor = prompt(
    retirar ? "Cantidad que retirarás:" : "Existencia correcta en Producción:"
  );
  if(valor === null) return;

  const cantidad = numero(valor, !retirar);
  const motivo = prompt("Motivo obligatorio:");
  if(!motivo || !motivo.trim()) return;

  await cambiar(
    retirar ? "produccionRetirar" : "produccionEditar",
    base => {
      const m = buscarMaterial(base, codigo);
      const anterior = Number(m.produccion || 0);

      if(retirar && cantidad > anterior){
        throw new Error("No puedes retirar más de lo disponible.");
      }

      m.produccion = retirar ? anterior - cantidad : cantidad;

      movimiento(base,
        retirar ? "Retiro Producción" : "Ajuste Producción",
        m, m.produccion - anterior, motivo.trim()
      );

      log(base, "Modificó Producción " + codigo + ": " + motivo.trim());
    }
  );

  K.show();
};

K.fabricar = async function(){
  const codigo = campo("kFabricarCodigo");
  const cantidad = entero(campo("kFabricarCantidad"));

  if(cantidad > 1000){
    throw new Error("Registra como máximo 1000 unidades por operación.");
  }

  // Se sortea ANTES de la transacción.
  // Los reintentos no vuelven a cambiar el resultado.
  const denominador = sesion.rol === R.operador ? 3 : 5;

  const unidades = Array.from({length: cantidad}, () => ({
    id: id(),
    aCalidad: Math.floor(Math.random() * denominador) === 0
  }));

  const cantidadCalidad = unidades.filter(u => u.aCalidad).length;

  if(!confirm(
    "¿Registrar " + cantidad + " unidades fabricadas?\n" +
    "Se consumirán sus componentes de Producción."
  )) return;

  await cambiar("fabricar", (base, cuenta) => {
    const esperado = cuenta.rol === R.operador ? 3 : 5;

    if(esperado !== denominador){
      throw new Error("Tu rol cambió. Actualiza e intenta de nuevo.");
    }

    const p = buscarProducto(base, codigo);

    if(!Array.isArray(p.componentes) || !p.componentes.length){
      throw new Error("El producto no tiene componentes.");
    }

    const consumos = {};

    p.componentes.forEach(c => {
      const uso = numero(c.cantidad);
      consumos[c.codigo] = (consumos[c.codigo] || 0) + uso * cantidad;
    });

    Object.entries(consumos).forEach(([codigoMP, total]) => {
      const m = buscarMaterial(base, codigoMP);

      if(Number(m.produccion || 0) < total){
        throw new Error("Falta material en Producción: " + m.nombre);
      }
    });

    Object.entries(consumos).forEach(([codigoMP, total]) => {
      const m = buscarMaterial(base, codigoMP);
      m.produccion = Number(m.produccion || 0) - total;

      movimiento(base, "Consumo fabricación", m, total,
        "Producción → Fabricación " + codigo);
    });

    p.pt = Number(p.pt || 0) + cantidad - cantidadCalidad;

    unidades.filter(u => u.aCalidad).forEach(u => {
      base.calidad.unshift({
        id: u.id,
        codigoProducto: codigo,
        producto: p.nombre,
        estado: "pendiente",
        enviadoPor: sesion.usuario,
        rolOrigen: sesion.rol,
        fecha: ahora(),
        probabilidad: "1/" + denominador
      });
    });

    movimiento(base, "Fabricación", p, cantidad,
      "Producción → PT/Calidad");

    log(base,
      "Fabricó " + cantidad + " de " + codigo +
      "; a Calidad: " + cantidadCalidad +
      "; a PT: " + (cantidad - cantidadCalidad)
    );
  });

  K.show();

  alert(
    "Fabricación registrada.\n" +
    "A PT: " + (cantidad - cantidadCalidad) + "\n" +
    "A Calidad: " + cantidadCalidad
  );
};

K.ajustarPT = async function(codigo){
  const p = buscarProducto(d, codigo);
  const valor = prompt("Existencia correcta en PT:", p.pt || 0);
  if(valor === null) return;

  const cantidad = numero(valor, true);
  if(!Number.isSafeInteger(cantidad)){
    throw new Error("PT debe ser un número entero.");
  }

  const motivo = prompt("Motivo del ajuste:");
  if(!motivo || !motivo.trim()) return;

  await cambiar("ptEditar", base => {
    const producto = buscarProducto(base, codigo);
    const diferencia = cantidad - Number(producto.pt || 0);
    producto.pt = cantidad;
    movimiento(base, "Ajuste PT", producto, diferencia, motivo.trim());
    log(base, "Ajustó PT " + codigo + ": " + motivo.trim());
  });

  K.show();
};

K.inspeccionar = async function(unidadId, aprobar){
  const observaciones = prompt(
    aprobar ? "Observaciones de aprobación:" : "Motivo obligatorio del rechazo:"
  );

  if(observaciones === null) return;

  if(!aprobar && !observaciones.trim()){
    throw new Error("Escribe el motivo del rechazo.");
  }

  await cambiar("inspeccionar", base => {
    const unidad = base.calidad.find(c => c.id === unidadId);

    if(!unidad || unidad.estado !== "pendiente"){
      throw new Error("Esta unidad ya fue inspeccionada.");
    }

    const p = buscarProducto(base, unidad.codigoProducto);

    unidad.estado = aprobar ? "aprobado" : "rechazado";
    unidad.inspector = sesion.usuario;
    unidad.fechaInspeccion = ahora();
    unidad.observaciones = observaciones.trim();

    if(aprobar){
      p.pt = Number(p.pt || 0) + 1;
      movimiento(base, "Aprobación CC", p, 1, "Calidad → PT");
    }else{
      base.informes.unshift({
        id: id(),
        unidadId,
        codigoProducto: p.codigo,
        producto: p.nombre,
        motivo: observaciones.trim(),
        inspector: sesion.usuario,
        produccionUsuario: unidad.enviadoPor,
        fecha: ahora()
      });

      movimiento(base, "Rechazo CC", p, 1, "Calidad → Baja por defecto");
    }

    log(base, "Calidad " + unidad.estado + " unidad " + unidadId);
  });

  K.show();
};

K.guardarDiseno = async function(){
  capturarDiseno();
  const copia = JSON.parse(JSON.stringify(borrador));

  if(!copia.codigo || !copia.nombre || !copia.componentes.length){
    throw new Error("Faltan código, nombre o componentes.");
  }

  await cambiar("disenar", base => {
    copia.componentes.forEach(c => {
      buscarMaterial(base, c.codigo);
      numero(c.cantidad);
    });

    if(copia.editando){
      if(copia.codigo !== copia.editando){
        throw new Error("No cambies el código de un producto existente.");
      }

      const p = buscarProducto(base, copia.editando);
      p.nombre = copia.nombre;
      p.descripcion = copia.descripcion;
      p.componentes = copia.componentes;

      log(base, "Corrigió diseño " + copia.codigo);
    }else{
      codigoLibre(base, copia.codigo);

      base.productos.push({
        codigo: copia.codigo,
        nombre: copia.nombre,
        descripcion: copia.descripcion,
        componentes: copia.componentes,
        pt: 0
      });

      log(base, "Creó diseño " + copia.codigo);
    }
  });

  K.nuevoDiseno();
};

K.enviar = async function(){
  const envio = {
    id: id(),
    codigoProducto: campo("kEnvioProducto"),
    cantidad: entero(campo("kEnvioCantidad")),
    lugar: campo("kEnvioLugar"),
    destinatario: campo("kEnvioDestinatario"),
    direccion: campo("kEnvioDireccion"),
    fechaEnvio: campo("kEnvioFecha"),
    responsable: campo("kEnvioResponsable"),
    observaciones: campo("kEnvioObservaciones"),
    estado: "enviado",
    registradoPor: sesion.usuario,
    fechaRegistro: ahora()
  };

  if(
    !envio.codigoProducto || !envio.lugar ||
    !envio.destinatario || !envio.direccion ||
    !envio.fechaEnvio || !envio.responsable
  ){
    throw new Error("Completa todos los campos del envío.");
  }

  if(!confirm("¿Confirmar envío de " + envio.cantidad + " unidades?")) return;

  await cambiar("enviar", base => {
    const p = buscarProducto(base, envio.codigoProducto);

    if(Number(p.pt || 0) < envio.cantidad){
      throw new Error("No hay suficientes unidades disponibles en PT.");
    }

    p.pt = Number(p.pt || 0) - envio.cantidad;

    base.envios.unshift({...envio, producto: p.nombre});

    movimiento(base, "Envío", p, envio.cantidad,
      "PT → " + envio.lugar);

    log(base, "Registró envío " + envio.id);
  });

  K.show();
};

K.entregado = async function(envioId){
  const recibidoPor = prompt("Nombre de quien recibió:");
  if(!recibidoPor || !recibidoPor.trim()) return;

  await cambiar("enviar", base => {
    const envio = base.envios.find(e => e.id === envioId);

    if(!envio || envio.estado !== "enviado"){
      throw new Error("El envío ya fue entregado o no existe.");
    }

    envio.estado = "entregado";
    envio.recibidoPor = recibidoPor.trim();
    envio.fechaEntrega = ahora();
    // Aquí NO se vuelve a descontar inventario.
    log(base, "Confirmó entrega del envío " + envioId);
  });

  K.show();
};

K.crearUsuario = async function(){
  const usuario = campo("kAltaUsuario");
  const contrasena = campo("kAltaClave");
  const rol = campo("kAltaRol");

  if(!usuario || !contrasena || !Object.values(R).includes(rol)){
    throw new Error("Completa usuario, contraseña y rol.");
  }

  await cambiar("administrar", base => {
    if(base.usuarios.some(u =>
      String(u.usuario).toLowerCase() === usuario.toLowerCase()
    )){
      throw new Error("Ese usuario ya existe.");
    }

    base.usuarios.push({usuario, contrasena, rol});
    log(base, "Creó usuario " + usuario);
  });

  K.show();
};

K.editarUsuario = async function(usuario){
  const actual = d.usuarios.find(u => u.usuario === usuario);
  if(!actual) throw new Error("Usuario no encontrado.");

  const rol = prompt(
    "Escribe un rol de esta lista:\n" +
    Object.values(R).join("\n"),
    actual.rol
  );

  if(rol === null) return;
  if(!Object.values(R).includes(rol)){
    throw new Error("El rol no coincide con una opción válida.");
  }

  const clave = prompt(
    "Nueva contraseña; deja vacío para conservar la actual:"
  );

  if(clave === null) return;

  await cambiar("administrar", base => {
    const u = base.usuarios.find(x => x.usuario === usuario);
    if(!u) throw new Error("La cuenta ya no existe.");

    if(usuario === sesion.usuario && rol !== R.sistemas){
      throw new Error("No puedes quitarte tu acceso de encargado.");
    }

    u.rol = rol;
    if(clave.trim()) u.contrasena = clave.trim();

    log(base, "Corrigió cuenta de " + usuario);
  });

  K.show();
};

K.borrarUsuario = async function(usuario){
  if(!confirm("¿Eliminar usuario " + usuario + "?")) return;

  await cambiar("administrar", base => {
    if(usuario === sesion.usuario){
      throw new Error("No puedes eliminar tu propia cuenta.");
    }

    base.usuarios = base.usuarios.filter(u => u.usuario !== usuario);
    log(base, "Eliminó usuario " + usuario);
  });

  K.show();
};

K.borrarRegistro = async function(){
  const area = campo("kBorrarArea");
  const codigo = campo("kBorrarCodigo");

  const permitidas = [
    "kanban", "productos", "solicitudes",
    "calidad", "envios", "informes"
  ];

  if(!permitidas.includes(area) || !codigo){
    throw new Error("Selecciona un área y escribe el identificador.");
  }

  if(!confirm("¿Eliminar " + codigo + " de " + area + "?")) return;

  await cambiar("administrar", base => {
    const clave = ["kanban", "productos"].includes(area) ? "codigo" : "id";
    const registro = base[area].find(x => x[clave] === codigo);

    if(!registro) throw new Error("Registro no encontrado.");

    if(area === "productos"){
      if(
        Number(registro.pt || 0) !== 0 ||
        base.calidad.some(c =>
          c.codigoProducto === codigo && c.estado === "pendiente"
        )
      ){
        throw new Error("El producto tiene stock o inspecciones pendientes.");
      }
    }

    if(
      area === "kanban" &&
      base.solicitudes.some(s =>
        s.kanban === codigo && s.estado === "pendiente"
      )
    ){
      throw new Error("Esta tarjeta tiene una solicitud pendiente.");
    }

    if(
      (area === "solicitudes" || area === "calidad") &&
      registro.estado === "pendiente"
    ){
      throw new Error("Primero resuelve el registro pendiente.");
    }

    if(area === "envios" && registro.estado === "enviado"){
      throw new Error("Primero confirma la entrega del envío.");
    }

    base[area] = base[area].filter(x => x[clave] !== codigo);
    log(base, "Eliminó " + area + ": " + codigo);
  });

  K.show();
};

K.reiniciar = async function(){
  if(!esAdmin(sesion)) throw new Error("Solo el encargado.");

  if(!confirm(

  if(prompt("Escribe BORRAR SISTEMA") !== "BORRAR SISTEMA") return;

  await cambiar("administrar", base => ({
    usuarios: base.usuarios
  }));

  borrador = {
    codigo: "", nombre: "", descripcion: "",
    componentes: [], editando: false
  };
// Elimina la copia del prototipo anterior de este navegador.
  localStorage.removeItem("almacenKanbanMultiusuario");

  vista = "mp";
  K.show();

  alert("Sistema reiniciado. Usuarios conservados.");
};

K.run = async function(accion, ...argumentos){
  try{
    if(typeof K[accion] !== "function"){
      throw new Error("Acción desconocida.");
    }

    await K[accion](...argumentos);

  }catch(error){
    console.error(error);
    alert(
      (error.code ? error.code + "\n" : "") +
      error.message
    );
  }
};

  alert(

});

  pendiente = false;
  K.show();
};
